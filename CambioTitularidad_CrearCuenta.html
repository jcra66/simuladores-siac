<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIAC UNICO - Crear Cuenta / Datos del Nuevo Cliente</title>
<link rel="stylesheet" href="./assets_css_styles.css">
</head>
<body>
<div id="top"></div>

<div class="contenedor">
  <div class="col-ficha" id="ficha"></div>

  <div class="col-main">

    <div class="msg info">
      3.2.17 Presionamos Crear Cuenta, cuando el cliente no tiene alguna cuenta existente.
    </div>

    <div class="panel">
      <div class="panel-body">
        <div class="form-row">
          <div class="form-col">
            <div class="campo"><button class="btn" id="btnEvaluacion">Evaluacion</button></div>
          </div>
          <div class="form-col">
            <label>Sec:</label>
            <div class="campo"><input type="text" id="sec" readonly></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <div class="campo"><button class="btn" id="btnCrearCuenta">Crear Cuenta</button></div>
          </div>
          <div class="form-col">
            <div class="campo">
              <a class="btn" href="./CambioTitularidad_TransferirCuentaExistente.html">Transferir en Cuenta Existente</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">DATOS DEL NUEVO CLIENTE</div>
      <div class="panel-body">
        <a class="acordeon-item" style="display:block;color:#fff;"
           href="./CambioTitularidad_DatosIdentificacionPersonal.html">Datos de Identificacion Personal</a>
        <a class="acordeon-item" style="display:block;color:#fff;"
           href="./CambioTitularidad_DatosContacto.html">Datos de Contacto</a>
      </div>
    </div>

    <div class="panel">
      <div class="panel-body">
        <div class="form-row">
          <div class="form-col">
            <label>Fecha de Programacion:</label>
            <div class="campo"><input type="text" id="fechaProg" value="11/11/2026" style="text-align:left;"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label>Envio por E-mail:</label>
            <div class="campo">
              <input type="checkbox" id="chkMail" checked style="width:auto;">
              <input type="text" id="mail" style="text-align:left;">
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label>Punto de Atencion:</label>
            <div class="campo">
              <select id="pto">
                <option>Seleccionar</option>
                <option>CAC ANGAMOS 123</option>
                <option>CAC LA MOLINA</option>
                <option>CAC MIRAFLORES</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col" style="flex:1 1 100%;">
            <label>Notas:</label>
            <div class="campo"><textarea id="notas" placeholder="Agregar Notas"></textarea></div>
          </div>
        </div>

        <div id="msg"></div>

        <div class="botonera">
          <button class="btn" id="btnContinuar">Continuar a Datos de Identificacion Personal</button>
          <a class="btn secundario" href="./CambioTitularidad_LineasCuentaOrigen.html">Volver</a>
          <button class="btn rojo ico ico-home" id="btnCerrar">Cerrar</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./assets_js_app.js"></script>
<script>
  SIAC.layout({
    titulo: "Cambio de Titularidad",
    paso: "Datos Nuevo Titular",
    ficha: true,
    registrar: "Crear Cuenta"
  });

  SIAC.porId("mail").value = SIAC.obtenerDato("envioMail", SIAC.DATOS.email);
  SIAC.porId("sec").value = SIAC.obtenerDato("sec", "");
  SIAC.guardarDato("tipoDestino", "CUENTA NUEVA");

  SIAC.porId("btnEvaluacion").onclick = function () {
    SIAC.porId("sec").value = "7180613 - APROBADO";
    SIAC.guardarDato("sec", "7180613 - APROBADO");
    SIAC.registrarPaso("Crear Cuenta", "Evaluacion crediticia en SISACT: APROBADO");
    SIAC.mensaje("msg", "ok", "Evaluacion crediticia APROBADA en SISACT (Sec: 7180613) - SIMULADO.");
  };

  SIAC.porId("btnCrearCuenta").onclick = function () {
    if (!SIAC.porId("sec").value) {
      SIAC.mensaje("msg", "warn", "Debe ejecutar la Evaluacion crediticia antes de crear la cuenta.");
      SIAC.registrarError("Crear Cuenta", "Crear Cuenta sin evaluacion crediticia", "Regla de negocio");
      return;
    }
    SIAC.registrarPaso("Crear Cuenta", "Crea cuenta nueva para el nuevo titular");
    window.location.href = "./CambioTitularidad_DatosIdentificacionPersonal.html";
  };

  SIAC.porId("btnContinuar").onclick = function () {
    SIAC.guardarDato("fechaProg", SIAC.porId("fechaProg").value);
    SIAC.guardarDato("puntoAtencion", SIAC.porId("pto").value);
    SIAC.guardarDato("notas", SIAC.porId("notas").value);
    SIAC.guardarDato("envioMail", SIAC.porId("chkMail").checked ? SIAC.porId("mail").value : "");
    window.location.href = "./CambioTitularidad_DatosIdentificacionPersonal.html";
  };

  SIAC.porId("btnCerrar").onclick = function () {
    SIAC.registrarPaso("Crear Cuenta", "Cierra la pagina");
    window.location.href = "./CambioTitularidad_CambioTitularidad.html";
  };
</script>
</body>
</html>
