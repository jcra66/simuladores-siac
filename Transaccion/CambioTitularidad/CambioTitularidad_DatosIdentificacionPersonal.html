<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambio de Titularidad - Datos de Identificación Personal</title>
<link rel="stylesheet" href="assets_css_styles.css">
</head>
<body>
<div id="hdr"></div>
<div id="ruta" class="ruta"></div>
<div class="wrap">
  <div class="col-cliente" id="ficha"></div>
  <div class="col-main">
    <div id="msgGlobal" class="oculto"></div>
    <div class="panel">
      <div class="panel-header"><span class="icono">&#128100;</span>Datos de Identificación Personal (3.2.18)</div>
      <div class="panel-body">
        <div class="escenario">Ingrese los datos modificables. Los campos deshabilitados provienen de la evaluación del nuevo titular.</div>
        <div id="msg" class="oculto"></div>
        <div class="subpanel">
          <div class="form-row">
            <div class="form-group"><label>Tipo Documento:</label>
              <select id="tipoDoc" disabled><option>DNI</option><option>CE</option><option>PASAPORTE</option><option>RUC</option></select></div>
            <div class="form-group"><label>Nro. Documento:</label><input type="text" id="nroDoc" readonly></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Nombre:</label><input type="text" id="nombre" readonly></div>
            <div class="form-group"><label>Apellidos:</label><input type="text" id="apellidos" readonly></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Fecha Nacimiento<span class="obligatorio">(*)</span></label><input type="date" id="fecNac"></div>
            <div class="form-group"><label>Nacionalidad:</label>
              <select id="nacionalidad"><option selected>Peru</option><option>Venezuela</option><option>Colombia</option><option>Otro</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Estado Civil:</label>
              <select id="estadoCivil"><option selected>Soltero (a)</option><option>Casado (a)</option><option>Viudo (a)</option><option>Divorciado (a)</option></select></div>
            <div class="form-group"><label>Sexo:</label>
              <span><label class="chk-inline"><input type="radio" name="sexo" value="Hombre" checked> Hombre</label>
              <label class="chk-inline"><input type="radio" name="sexo" value="Mujer"> Mujer</label>
              <label class="chk-inline"><input type="radio" name="sexo" value="NA"> NA</label></span></div>
          </div>
          <span class="nota-obligatorio">(*) Campos Obligatorios</span>
        </div>
      </div>
      <div class="botonera" style="border-top:1px solid #eee">
        <button type="button" class="btn btn-claro" onclick="volver()">Volver</button>
        <button type="button" class="btn" onclick="continuar()">Continuar a Datos de Contacto</button>
      </div>
    </div>
  </div>
</div>
<div class="footer-nota">ENTORNO DE ENTRENAMIENTO · Datos ficticios</div>

<script src="assets_js_app.js"></script>
<script>
SIAC.initPantalla({ nombre: 'Datos de Identificación Personal', paso: '3.2.18', menu: 'cuenta', linea: SIAC.CLIENTE.linea });
SIAC.fichaCliente('ficha');

var d = SIAC.datos();
var nt = d.nuevoTitular || { tipoDoc: 'DNI', nroDoc: '47328440', nombre: 'CARLOS ANDRES', apellidos: 'TORRES SIMULADO', fecNac: '1990-08-09' };
document.getElementById('tipoDoc').value = nt.tipoDoc;
document.getElementById('nroDoc').value = nt.nroDoc + ' (SIMULADO)';
document.getElementById('nombre').value = nt.nombre;
document.getElementById('apellidos').value = nt.apellidos;
document.getElementById('fecNac').value = nt.fecNac || '';

function continuar() {
  if (!document.getElementById('fecNac').value) {
    SIAC.mensaje('msg', 'Debe ingresar la Fecha de Nacimiento (campo obligatorio).', 'error');
    SIAC.registrar('Datos de Identificación Personal', 'Continuar sin fecha de nacimiento', 'ERROR: Debe ingresar Fecha Nacimiento');
    return;
  }
  SIAC.guardarDatos({
    identificacion: {
      tipoDoc: document.getElementById('tipoDoc').value, nroDoc: nt.nroDoc,
      nombre: document.getElementById('nombre').value, apellidos: document.getElementById('apellidos').value,
      fecNac: document.getElementById('fecNac').value,
      nacionalidad: document.getElementById('nacionalidad').value,
      estadoCivil: document.getElementById('estadoCivil').value,
      sexo: document.querySelector('input[name=sexo]:checked').value
    }
  });
  SIAC.registrar('Datos de Identificación Personal', 'Registra datos del titular', 'OK');
  SIAC.ir('CambioTitularidad_DatosContacto.html', 'Datos de Contacto');
}

function volver() {
  var dd = SIAC.datos();
  SIAC.ir(dd.modalidad === 'CREAR_CUENTA'
    ? 'CambioTitularidad_CrearCuenta.html'
    : 'CambioTitularidad_TransferirCuentaExistente.html', 'Pantalla anterior');
}
</script>
</body>
</html>
