<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIAC UNICO - Datos de Contacto</title>
<link rel="stylesheet" href="./assets_css_styles.css">
</head>
<body>
<div id="top"></div>

<div class="contenedor">
  <div class="col-ficha" id="ficha"></div>

  <div class="col-main">

    <div class="msg info">3.2.19 Ingresamos los datos en Datos de Contacto.</div>

    <div class="panel">
      <div class="panel-head">Datos de Contacto</div>
      <div class="panel-body">

        <div class="form-row">
          <div class="form-col">
            <label>Telefono 1:</label>
            <div class="campo"><input type="text" id="tel1" value="9955555"></div>
          </div>
          <div class="form-col">
            <label>Telefono 2:</label>
            <div class="campo"><input type="text" id="tel2" value="95654411"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Email:</label>
            <div class="campo"><input type="text" id="email" value="juan.perez@correo-simulado.com"></div>
          </div>
          <div class="form-col">
            <label>Confirmar Email<span class="obligatorio">(*)</span>:</label>
            <div class="campo"><input type="text" id="email2" value="juan.perez@correo-simulado.com"></div>
          </div>
        </div>

        <div class="subtitulo-link">Direccion de Domicilio</div>

        <div class="form-row">
          <div class="form-col">
            <label>Calle/Av./Jr.<span class="obligatorio">(*)</span>:</label>
            <div class="campo">
              <select id="tipoCalle">
                <option value="">Seleccionar</option>
                <option>CA - Calle</option>
                <option>AV - Avenida</option>
                <option>JR - Jiron</option>
                <option>PS - Pasaje</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <label>Nombre Calle/Av./Jr.<span class="obligatorio">(*)</span>:</label>
            <div class="campo"><input type="text" id="nomCalle" value="santa monica" style="text-align:left;"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Numero<span class="obligatorio">(*)</span>:</label>
            <div class="campo"><input type="text" id="numero" value="5" style="text-align:left;"></div>
          </div>
          <div class="form-col">
            <label>S/N:</label>
            <div class="campo"><input type="checkbox" id="sn" style="width:auto;"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Mz/Bloque/Edif:</label>
            <div class="campo">
              <select id="mz">
                <option>Seleccionar</option>
                <option>MZ - Manzana</option>
                <option>BL - Bloque</option>
                <option>ED - Edificio</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <label>Nro Mz/Bloque/Edif:</label>
            <div class="campo"><input type="text" id="nroMz" style="text-align:left;"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Tipo Dpt/Int:</label>
            <div class="campo">
              <select id="tipoDpt">
                <option>Seleccionar</option>
                <option>DP - Departamento</option>
                <option>IN - Interior</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <label>Numero Dpto/Int:</label>
            <div class="campo"><input type="text" id="nroDpto" style="text-align:left;"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Urb/Res/Pje:</label>
            <div class="campo">
              <select id="urb">
                <option>Seleccionar</option>
                <option>UR - Urbanizacion</option>
                <option>RE - Residencial</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <label>Nombre Urb/Res/Pje:</label>
            <div class="campo"><input type="text" id="nomUrb" readonly></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Zona/Etapa:</label>
            <div class="campo">
              <select id="zona">
                <option>Seleccionar</option>
                <option>ZN - Zona</option>
                <option>ET - Etapa</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <label>Nombre Zona/Etapa:</label>
            <div class="campo"><input type="text" id="nomZona" readonly></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Referencias<span class="obligatorio">(*)</span>:</label>
            <div class="campo"><input type="text" id="referencia" maxlength="40" value="costado metro" style="text-align:left;"></div>
          </div>
          <div class="form-col">
            <label class="obligatorio">(Max.40):</label>
            <div class="campo"><input type="text" id="cntRef" readonly value="13" style="max-width:60px;"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Pais:</label>
            <div class="campo">
              <select id="pais"><option>Peru</option></select>
            </div>
          </div>
          <div class="form-col">
            <label>Departamento<span class="obligatorio">(*)</span>:</label>
            <div class="campo">
              <select id="depa">
                <option value="">Seleccionar</option>
                <option>LIMA</option>
                <option>AREQUIPA</option>
                <option>LA LIBERTAD</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Provincia<span class="obligatorio">(*)</span>:</label>
            <div class="campo">
              <select id="prov">
                <option value="">Seleccionar</option>
                <option>LIMA</option>
                <option>CALLAO</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <label>Distrito<span class="obligatorio">(*)</span>:</label>
            <div class="campo">
              <select id="dist">
                <option value="">Seleccionar</option>
                <option>SAN JUAN DE MIRAFLORES</option>
                <option>MIRAFLORES</option>
                <option>SURCO</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Cod Postal:</label>
            <div class="campo"><input type="text" id="codPostal" value="025" style="text-align:left;"></div>
          </div>
        </div>

        <div class="nota-oblig">(*) Campos Obligatorios</div>

        <div id="msg"></div>

        <div class="botonera">
          <button class="btn" id="btnContinuar">Continuar a Direccion de Facturacion</button>
          <a class="btn secundario" href="./CambioTitularidad_DatosIdentificacionPersonal.html">Volver</a>
          <button class="btn rojo ico ico-home" id="btnCerrar">Cerrar</button>
        </div>

      </div>
    </div>

  </div>
</div>

<script src="./assets_js_app.js"></script>
<script>
  SIAC.layout({
    titulo: "Cambio de Titularidad",
    paso: "Datos Nuevo Titular",
    ficha: true,
    registrar: "Datos de Contacto"
  });

  SIAC.porId("referencia").onkeyup = function () {
    SIAC.porId("cntRef").value = this.value.length;
  };
  SIAC.porId("sn").onclick = function () {
    var n = SIAC.porId("numero");
    n.disabled = this.checked;
    if (this.checked) { n.value = ""; }
  };

  SIAC.porId("btnContinuar").onclick = function () {
    var e1 = SIAC.porId("email").value.trim();
    var e2 = SIAC.porId("email2").value.trim();

    if (!SIAC.porId("tipoCalle").value) {
      SIAC.modal("Alerta", "Debe ingresar tipo de calle");
      SIAC.mensaje("msg", "err", "Debe ingresar tipo de calle");
      SIAC.registrarError("Datos de Contacto", "Tipo de calle no seleccionado", "Validacion");
      return;
    }
    if (!SIAC.porId("referencia").value.trim()) {
      SIAC.modal("Alerta", "Debe ingresar una referencia de domicilio");
      SIAC.mensaje("msg", "err", "Debe ingresar una referencia de domicilio");
      SIAC.registrarError("Datos de Contacto", "Referencia de domicilio vacia", "Validacion");
      return;
    }
    if (!SIAC.porId("depa").value) {
      SIAC.modal("Alerta", "Debe seleccionar departamento domicilio");
      SIAC.mensaje("msg", "err", "Debe seleccionar departamento domicilio");
      SIAC.registrarError("Datos de Contacto", "Departamento no seleccionado", "Validacion");
      return;
    }
    if (!SIAC.porId("prov").value) {
      SIAC.modal("Alerta", "Debe seleccionar provincia domicilio");
      SIAC.mensaje("msg", "err", "Debe seleccionar provincia domicilio");
      SIAC.registrarError("Datos de Contacto", "Provincia no seleccionada", "Validacion");
      return;
    }
    if (!SIAC.porId("dist").value) {
      SIAC.modal("Alerta", "Debe seleccionar un distrito domicilio");
      SIAC.mensaje("msg", "err", "Debe seleccionar un distrito domicilio");
      SIAC.registrarError("Datos de Contacto", "Distrito no seleccionado", "Validacion");
      return;
    }
    if (e1 !== e2) {
      SIAC.mensaje("msg", "err", "El correo de confirmacion no coincide con el Email ingresado.");
      SIAC.registrarError("Datos de Contacto", "Email y Confirmar Email no coinciden", "Validacion");
      return;
    }

    SIAC.guardarDato("domTipoCalle", SIAC.porId("tipoCalle").value);
    SIAC.guardarDato("domNomCalle", SIAC.porId("nomCalle").value);
    SIAC.guardarDato("domNumero", SIAC.porId("numero").value);
    SIAC.guardarDato("domMz", SIAC.porId("mz").value);
    SIAC.guardarDato("domReferencia", SIAC.porId("referencia").value);
    SIAC.guardarDato("domDepa", SIAC.porId("depa").value);
    SIAC.guardarDato("domProv", SIAC.porId("prov").value);
    SIAC.guardarDato("domDist", SIAC.porId("dist").value);
    SIAC.guardarDato("nvoTel1", SIAC.porId("tel1").value);
    SIAC.guardarDato("nvoEmail", e1);

    SIAC.registrarPaso("Datos de Contacto", "Registra datos de contacto y direccion de domicilio");
    window.location.href = "./CambioTitularidad_DireccionFacturacion.html";
  };

  SIAC.porId("btnCerrar").onclick = function () {
    SIAC.registrarPaso("Datos de Contacto", "Cierra la pagina");
    window.location.href = "./CambioTitularidad_CambioTitularidad.html";
  };
</script>
</body>
</html>
